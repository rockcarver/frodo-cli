# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# - One grouped weekly PR for development-dependency minor/patch updates.
#   Prettier, TypeScript and ESLint are excluded from the group (and TS majors
#   ignored entirely): Prettier minors reformat code, and the TypeScript/ESLint
#   majors need coordinated config work - those arrive as individual PRs for
#   human review.
# - The exact @rockcarver/frodo-lib pin is updated by this too, so new library
#   releases automatically arrive here as a PR.
# - Weekly updates for the GitHub Actions used by the workflows, except
#   github/gh-aw-actions/setup (see the ignore below).
# - Dependabot security updates are enabled separately in repo settings.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "prettier"
          - "typescript"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # typescript-eslint publishes plugin/parser/utils as one strictly
      # peer-coupled set; single-package bumps break `npm ci` with ERESOLVE
      # (see #780). Only the meta-package `typescript-eslint` (not ignored,
      # above) is tracked, which pulls the whole set in lockstep.
      - dependency-name: "@typescript-eslint/eslint-plugin"
      - dependency-name: "@typescript-eslint/parser"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The Issue Concierge's .github/workflows/*.lock.yml files are compiled by
      # gh-aw and record the compiler they were built with (compiler_version,
      # GH_AW_VERSION, the manifest, .github/aw/actions-lock.json). The setup
      # action installs the runtime scripts of the gh-aw version it is tagged
      # with, so bumping it alone leaves compiler and runtime out of step. A
      # Concierge release moves it by recompiling the locks; a Dependabot bump
      # would also be auto-merged when it is a patch (dependabot-auto-merge.yml).
      - dependency-name: "github/gh-aw-actions/setup"
