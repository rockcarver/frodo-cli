# Related-repo closer. Plain GitHub Actions, no LLM. See docs/multi-phase-design.md, "Split-repo routing".
#
# When a canonical issue (one that carries `original-in-related-repo`) is closed as completed, this
# updates the original issue in the related repository: it labels it `waiting-for-release` and comments
# when a release of the original's repository is needed before the fix reaches the reporter, and
# otherwise comments and closes it. A close that is not a completed fix changes nothing. A model used to
# do this and named the wrong issue (frodo-lib#806); everything here is decided by data, so a script does
# it (record 0026).
#
# The condition below is the guarantee that any other close starts nothing: an issue without the label
# is never looked at. A manual run does the same for one issue, and `dry_run` reports without writing.
#
# Install: copy this file to .github/workflows/related-repo-closer.yml and
# scripts/related-repo-closer.mjs to .github/scripts/related-repo-closer.mjs (it imports
# dependency-watch.mjs and reporter-notify.mjs, which imports janitor.mjs: install them too).
# Secret: the one related-repos.md names for the related repository, with Issues: Read and write
# there. The updater writes it into the `env` below (the marker) and `check-deployment` verifies it.
name: "Concierge 4b ▸ Related Repo Closer"

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "The canonical issue (closed, with the link label) whose original issue to update"
        required: true
        type: string
      dry_run:
        description: "Report what would be done, change nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

concurrency:
  group: related-repo-closer-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  close-original:
    # By hand: always. On an event: only for an issue that carries the link label and was not opened by
    # a bot. The script checks everything else (who opened it, why it was closed, the proof of the link).
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.type != 'Bot' && contains(github.event.issue.labels.*.name, 'original-in-related-repo'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the original issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          # concierge:cross-repo-env
        run: node .github/scripts/related-repo-closer.mjs $([ "$DRY_RUN" = "true" ] && echo --dry-run)
