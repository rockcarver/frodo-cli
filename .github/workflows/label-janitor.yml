# Label janitor. Plain GitHub Actions, no LLM. See docs/multi-phase-design.md, "Label lifecycle".
#
# Keeps an issue or pull request showing where it is, not where it has been: when the
# next gate label exists, the earlier one is removed, and when an issue closes the
# labels that describe open work are removed. It never touches classification or
# outcome labels. It runs on the label events that can change the answer, on
# assignment and close, hourly as a sweep for anything missed, and on demand.
#
# Install: copy this file to .github/workflows/label-janitor.yml and
# scripts/label-janitor.mjs to .github/scripts/label-janitor.mjs. No secret is needed:
# removing a label starts nothing, so the default token is enough.
name: Label janitor

on:
  issues:
    types: [labeled, assigned, closed]
  pull_request_target:
    types: [labeled, closed]
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Clean up this issue or pull request only (leave empty to sweep)"
        required: false
        type: string
      include_closed:
        description: "Sweep closed issues and pull requests too (one-off tidy-up of old items)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Report what would be removed, change nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: label-janitor-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || 'sweep' }}
  cancel-in-progress: false

jobs:
  clean:
    # A label event starts the job only for the labels that can change the answer.
    # Keep this list identical to TRIGGER_LABELS in scripts/label-janitor.mjs (a test checks it).
    if: >-
      github.event.action != 'labeled'
      || contains(fromJSON('["issue-worker-ready","issue-triage-handoff","plan-worker-ready","plan-triage-handoff","pr-worker-ready","pr-triage-handoff","backlog","needs-info","dependency-required","scope-review","out-of-scope","duplicate","invalid","already-fixed","spam","plan-approval-required"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove stale labels
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
          INCLUDE_CLOSED: ${{ inputs.include_closed }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/label-janitor.mjs
