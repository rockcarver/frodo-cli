# Issue Concierge status. Plain GitHub Actions, no LLM. See docs/multi-phase-design.md, "The maintainer's view".
#
# Keeps one pinned issue, "Issue Concierge status", up to date: what waits for a maintainer, the reporter replies nobody
# has answered, which issues the Concierge manages and which it does not, the health of the gates and what they
# cost. It runs when a label that matters is applied, when the coding agent is assigned or unassigned, when someone
# comments, on a schedule, and by hand. A label being removed starts nothing here (only the issue worker and the plan
# approval resume start on a removal): every way a maintainer accepts an issue applies a label. The schedule asks for
# every hour, but GitHub starts a scheduled run when it can, and on a quiet repository that was every few hours (3.5 to
# 10 on 2026-11-01 and 2026-11-02), so nothing that has to show promptly may rely on it: the coding agent's failure is a
# label event (scripts/agent-start-watch.mjs). Runs are queued one behind the other (a burst of events is one run after
# the one in progress), and a run that finds nothing changed writes nothing.
#
# The settings are in .github/issue-concierge/settings.yml (template: shared/settings.yml). With
# `status-issue: false` the issue is closed and unpinned and nothing updates it. The Concierge never acts on this
# issue: it is opened by the bot and carries 'no-auto-processing', and every gate skips both.
#
# An issue that carries 'no-auto-processing' starts no run here ("Opting an item out"); the hourly run counts it.
#
# Install: copy this file to .github/workflows/status.yml, and scripts/status-issue.mjs,
# scripts/issue-concierge-settings.mjs and scripts/issue-concierge-state.mjs to .github/scripts/ (they import janitor.mjs,
# opt-out.mjs, related-repo-closer.mjs and reporter-notify.mjs, and those import more, so install every script of the release).
# Needs SIGNAL_TOKEN to pin the issue and to report when that token expires; without it the issue is still written. With
# `mention-after-days` set it also names the maintainers in a comment on the page when something has waited too long, and
# lists the collaborators with the workflow token or, if that may not, with SIGNAL_TOKEN. To tell a reporter's reply from
# another commenter's on an issue that the Concierge opened from a report in a related repository, it reads that original
# issue (read-only, with the workflow token or else SIGNAL_TOKEN); without access the reply is shown as another commenter's.
name: "Issue Concierge 5a ▸ Status"

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the page and write nothing'
        required: false
        type: boolean
        default: false
  issues:
    types: [opened, closed, reopened, labeled, assigned, unassigned]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: concierge-status
  cancel-in-progress: false

jobs:
  status:
    # A label event starts the job only for the labels that change a number on the page, and an assignment only when it is
    # the coding agent's (the "With the coding agent" list). Keep the label list identical to TRIGGER_LABELS in
    # scripts/janitor.mjs (a test checks it).
    if: >-
      (github.event.action != 'labeled'
      || contains(fromJSON('["issue-worker-ready","issue-triage-handoff","plan-worker-ready","plan-triage-handoff","pr-worker-ready","pr-triage-handoff","backlog","needs-info","dependency-required","scope-review","needs-decision","out-of-scope","duplicate","invalid","already-fixed","spam","plan-approval-required","agent-start-failed"]'), github.event.label.name))
      && ((github.event.action != 'assigned' && github.event.action != 'unassigned')
      || contains(fromJSON('["Copilot","copilot-swe-agent","copilot-swe-agent[bot]"]'), github.event.assignee.login))
      && !contains(github.event.issue.labels.*.name, 'no-auto-processing')
      && github.event.issue.pull_request == null
      && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the status issue
        env:
          GH_TOKEN: ${{ github.token }}
          # Pins the issue, and is the token whose expiry the page reports.
          SIGNAL_TOKEN: ${{ secrets.SIGNAL_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          # When either is 'true' the page says so (the Concierge is paused).
          # CONCIERGE_PAUSED is the name the variable had before; it still pauses.
          ISSUE_CONCIERGE_PAUSED: ${{ vars.ISSUE_CONCIERGE_PAUSED }}
          CONCIERGE_PAUSED: ${{ vars.CONCIERGE_PAUSED }}
        run: node .github/scripts/status-issue.mjs
