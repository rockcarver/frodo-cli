name: 'Dependabot Auto-Merge'

# Arms auto-merge on a Dependabot pull request when core 0023
# (docs/decisions/core/0023-dependency-updates-arrive-late-and-only-tooling-merges-without-a-person.md)
# allows it. GitHub merges once the required status checks pass and the
# branch-protection ruleset is satisfied - this workflow only arms the merge.
# The decision is made by scripts/dependabot-auto-merge.mjs (unit tests:
# test/unit/DependabotAutoMerge.test.js); in short, a pull request is armed when
# - it is a patch or minor update of every dependency it touches (security
#   updates too: their type is derived from the lockfile);
# - it belongs to the Dependabot group `tooling` of dependabot.yml: packages
#   that end up in what we ship arrive ungrouped, one pull request each, and a
#   person merges them after looking at what changed in the package; so does a
#   GitHub Actions update and a security update (they are not in the group);
# - no dependency it touches has a name that stays manual: the whole word
#   eslint, prettier or typescript in the scope or in the name (Prettier
#   minors reformat code, the TypeScript and ESLint majors need coordinated
#   config work; the plugins and configs of ESLint and Prettier are meant by
#   it, which is what a plain substring test used to do by accident);
# - for an npm pull request, every package version that the lockfile adds or
#   changes, direct or transitive, was published at least 7 days ago. The
#   cooldown of dependabot.yml only covers what Dependabot proposes; a bump
#   also moves transitive packages to whatever is newest. A registry that
#   cannot be read means "not armed".
# A pull request that fails only the age test is looked at again every day.
#
# Not auto-merged, on purpose: major updates (they can break the API and need
# a human), the manual names above, bundled packages, and everything that
# fails a test above.
# Note: Dependabot "rules" in repo settings only triage alerts - they cannot
# auto-merge PRs. That is why this workflow exists.
#
# The script is read from the default branch, never from the pull request, so
# a pull request cannot change the rule that decides about itself.

on:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Guard on the actor for a pull request: skips immediately for every
    # non-Dependabot PR, including all human PRs. The scheduled and manual runs
    # only look at pull requests that Dependabot opened (the script checks the
    # author of each one).
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Arm auto-merge where the policy allows it
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/dependabot-auto-merge.mjs --pr "$PR_NUMBER"
          else
            node scripts/dependabot-auto-merge.mjs --all
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
