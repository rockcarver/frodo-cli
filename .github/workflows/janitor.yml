# Janitor. Plain GitHub Actions, no LLM. See docs/multi-phase-design.md, "Label lifecycle" and "Held runs".
#
# Two tasks. The first keeps an issue or pull request showing where it is, not where it
# has been: when the next gate label exists, the earlier one is removed, and when an issue
# closes the labels that describe open work are removed. It never touches classification or
# outcome labels. The second deletes the runs GitHub holds for approval that approving
# could only turn into a skipped run or into CI for a commit that is no longer the head: the
# Issue Worker run that every comment by the coding agent on its own pull request leaves
# behind, the Dependabot Auto-Merge run of every push (its job runs only for Dependabot), and
# the runs of pushes the pull request has moved past or of a pull request that is closed. It
# never deletes the held run for a pull request's current head, and none caused by anyone but
# the coding agent. Both run on the label events that can change the answer, on assignment and
# close, hourly as a sweep for anything missed, and on demand.
#
# Install: copy this file to .github/workflows/janitor.yml and
# scripts/janitor.mjs to .github/scripts/janitor.mjs (it imports opt-out.mjs, so install that too). No secret is needed: removing a label
# starts nothing, and deleting a run needs only `actions: write` on the default token (the sweep
# also reads pull requests, hence `pull-requests: read` on its job only).
name: "Issue Concierge 4a ▸ Janitor"

on:
  issues:
    types: [labeled, assigned, closed]
  pull_request_target:
    types: [labeled, closed]
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Clean up this issue or pull request only (leave empty to sweep)"
        required: false
        type: string
      include_closed:
        description: "Sweep closed issues and pull requests too (one-off tidy-up of old items)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Report what would be removed or deleted, change nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

# GitHub keeps one running and one pending run per group and cancels the older pending run when
# a newer one arrives. Triage adds several labels in the same second (complexity, risk, handoff).
# A run for a label that cannot change anything still takes its group's slot before its job is
# skipped, so with one group per item it can cancel the run that does the work (seen on
# frodo-lib#771). The label name in the key gives every label event its own group. The script
# reads the item's current labels and every removal is idempotent, so runs may overlap.
concurrency:
  group: janitor-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || 'sweep' }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  clean:
    # A label event starts the job only for the labels that can change the answer.
    # Keep this list identical to TRIGGER_LABELS in scripts/janitor.mjs (a test checks it).
    # An item that carries no-auto-processing is left alone ("Opting an item out" in docs/multi-phase-design.md).
    if: >-
      (vars.ISSUE_CONCIERGE_PAUSED != 'true' && vars.CONCIERGE_PAUSED != 'true' || github.event_name == 'workflow_dispatch')
      && (github.event.action != 'labeled'
      || contains(fromJSON('["issue-worker-ready","issue-triage-handoff","plan-worker-ready","plan-triage-handoff","pr-worker-ready","pr-triage-handoff","backlog","needs-info","dependency-required","scope-review","needs-decision","out-of-scope","duplicate","invalid","already-fixed","spam","plan-approval-required"]'), github.event.label.name))
      && !contains(github.event.issue.labels.*.name, 'no-auto-processing')
      && !contains(github.event.pull_request.labels.*.name, 'no-auto-processing')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove stale labels
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
          INCLUDE_CLOSED: ${{ inputs.include_closed }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/janitor.mjs

  # Deletes the runs GitHub holds for approval that approving could only turn into a skipped run or into CI
  # for a commit that is no longer the head (see DISPOSABLE_HELD_RUNS and disposableReason in
  # scripts/janitor.mjs). It needs `actions: write` and reads pull requests, so it is its own job and the
  # label job keeps its smaller token. It follows the label job and so starts for the same events. It skips
  # issue events: the runs it deletes come from the coding agent's work on its pull requests. The
  # janitor's own pull_request_target, schedule and dispatch runs have never been held (frodo-lib#775).
  held-runs:
    needs: clean
    if: ${{ !cancelled() && needs.clean.result != 'skipped' && (vars.ISSUE_CONCIERGE_PAUSED != 'true' && vars.CONCIERGE_PAUSED != 'true' || github.event_name == 'workflow_dispatch') && github.event_name != 'issues' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete held runs that approval cannot make useful
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/janitor.mjs --held-runs
