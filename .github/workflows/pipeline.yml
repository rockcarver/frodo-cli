name: 'Frodo CLI Release Pipeline'

on:
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**/CODE_OF_CONDUCT.md'
      - '**/README.md'
      - 'docs/**'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/CODE_OF_CONDUCT.md'
      - '**/README.md'
      - '**/pipeline.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release kind: prerelease | patch | minor | major'
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major
        default: 'prerelease'
        required: true

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rockcarver'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Update package-lock.json before version bump
        run: npm i --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Guard against version drift from latest release
        if: github.event_name != 'pull_request'
        run: |
          current_version="$(node -p "require('./package.json').version")"
          latest_npm_version="$(npm view @rockcarver/frodo-cli version 2>/dev/null || true)"
          latest_tag_version="$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk -F'/' '{print $3}' | sed 's/^v//' | sort -V | tail -n1)"

          latest_known_version="$latest_npm_version"
          if [ -n "$latest_tag_version" ]; then
            if [ -z "$latest_known_version" ]; then
              latest_known_version="$latest_tag_version"
            else
              latest_known_version="$(printf '%s\n%s\n' "$latest_known_version" "$latest_tag_version" | sort -V | tail -n1)"
            fi
          fi

          if [ -n "$latest_known_version" ]; then
            newest_seen="$(printf '%s\n%s\n' "$current_version" "$latest_known_version" | sort -V | tail -n1)"
            if [ "$newest_seen" != "$current_version" ]; then
              echo "::error::package.json version ($current_version) is behind latest published/tagged version ($latest_known_version)."
              exit 1
            fi
          fi

      - name: 'Determine Release Bump Type'
        id: release-bump
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "bumpType=prerelease" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/commits/$SHA/pulls")"
          pr_count="$(echo "$prs" | jq 'length')"
          if [ "$pr_count" -ne 1 ]; then
            echo "::error::Expected exactly one associated PR for commit $SHA on main, found $pr_count."
            exit 1
          fi

          release_labels="$(echo "$prs" | jq -r '.[0].labels[].name | select(. == "release:patch" or . == "release:minor" or . == "release:major")')"
          label_count="$(echo "$release_labels" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$label_count" -gt 1 ]; then
            echo "::error::PR has multiple release labels. Use exactly one of release:patch, release:minor, release:major."
            exit 1
          fi
          if [ "$label_count" -eq 0 ]; then
            echo "bumpType=prerelease" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          label="$(echo "$release_labels" | head -n 1)"
          case "$label" in
            "release:patch") echo "bumpType=patch" >> "$GITHUB_OUTPUT" ;;
            "release:minor") echo "bumpType=minor" >> "$GITHUB_OUTPUT" ;;
            "release:major") echo "bumpType=major" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unsupported release label: $label"; exit 1 ;;
          esac

      - name: 'Apply Version Bump'
        id: version-bump
        run: |
          current_version="$(node -p "require('./package.json').version")"
          bump_type="${{ steps.release-bump.outputs.bumpType }}"
          if [ -z "$bump_type" ]; then
            echo "::error::Missing bump type."
            exit 1
          fi

          case "$bump_type" in
            prerelease)
              new_version="$(node -p "require('semver').inc('$current_version','prerelease')")"
              ;;
            patch|minor|major)
              new_version="$(node -p "require('semver').inc('$current_version','$bump_type')")"
              ;;
            *)
              echo "::error::Unsupported bump type: $bump_type"
              exit 1
              ;;
          esac

          if [ -z "$new_version" ] || [ "$new_version" = "null" ]; then
            echo "::error::Failed to compute new version from $current_version using bump type $bump_type."
            exit 1
          fi

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if git ls-remote --tags --refs origin "refs/tags/v$new_version" | grep -q "refs/tags/v$new_version"; then
              echo "::error::Tag v$new_version already exists in origin. Refusing to continue."
              exit 1
            fi

            if npm view "@rockcarver/frodo-cli@$new_version" version >/dev/null 2>&1; then
              echo "::error::Version $new_version is already published on npm. Refusing to continue."
              exit 1
            fi
          fi

          npm version "$new_version" --no-git-tag-version --allow-same-version
          echo "newTag=v$new_version" >> "$GITHUB_OUTPUT"
          echo "newVersion=$new_version" >> "$GITHUB_OUTPUT"
          if echo "$new_version" | grep -q '-'; then
            echo "preRelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "preRelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package-lock.json after version bump
        run: npm i --package-lock-only

      - name: Build frodo-cli
        run: |
          npm run build

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc

      - name: Security Audit
        run: npm audit --audit-level critical

      - uses: actions/upload-artifact@v6
        with:
          name: build
          path: |
            package.json
            package-lock.json
            dist

    outputs:
      newTag: ${{ steps.version-bump.outputs.newTag }}
      newVersion: ${{ steps.version-bump.outputs.newVersion }}
      preRelease: ${{ steps.version-bump.outputs.preRelease }}

  test:
    name: 'Test'
    needs: build
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26, 24, 22]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Service containers to run with `test`
    services:
      # Label used to access the service container
      squid:
        image: ubuntu/squid
        ports:
          # Maps tcp port 3128 on the host to the same port in the service container
          - 3128:3128

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify Python runtime for PTY shell tests
        run: python3 --version

      - uses: actions/download-artifact@v7
        with:
          name: build

      - name: Install dependencies
        run: npm ci

      - name: Install frodo-cli globally
        run: npm i -g

      - name: CLI Tests
        env:
          FRODO_MASTER_KEY: ${{ secrets.FRODO_MASTER_KEY }}
        run: npm run test:serial

      - name: Version Test
        run: frodo -v

      - name: Direct Tests
        # don't run this test on PRs -> secrets are not available as workflow runs in the context of the external repo
        if: github.event_name != 'pull_request'
        env:
          FIDC_TENANT_URL: ${{ vars.FIDC_TENANT_URL }}
          FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          frodo conn save "$FIDC_TENANT_URL" --no-log-api
          frodo info "$FIDC_TENANT_URL"

      - name: Proxy Tests
        # don't run this test on PRs -> secrets are not available as workflow runs in the context of the external repo
        if: github.event_name != 'pull_request'
        env:
          HTTPS_PROXY: 'http://127.0.0.1:3128'
          FIDC_TENANT_URL: ${{ vars.FIDC_TENANT_URL }}
          FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          frodo conn save "$FIDC_TENANT_URL" --no-log-api
          frodo info "$FIDC_TENANT_URL"

  release:
    if: github.event_name != 'pull_request'
    needs:
      [
        build,
        linux-x64-binary-release,
        linux-arm64-binary-release,
        macos-intel-binary-release,
        macos-arm64-binary-release,
        npm-release,
        windows-x64-binary-release,
      ]
    name: 'Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: build

      - name: Download MacOS Intel Binary Release
        uses: actions/download-artifact@v7
        with:
          name: macos-intel-binary-release

      - name: Download MacOS ARM64 Binary Release
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-binary-release

      - name: Download Linux X64 Binary Release
        uses: actions/download-artifact@v7
        with:
          name: linux-x64-binary-release

      - name: Download Linux ARM64 Binary Release
        uses: actions/download-artifact@v7
        with:
          name: linux-arm64-binary-release

      - name: Download Windows X64 Binary Release
        uses: actions/download-artifact@v7
        with:
          name: windows-x64-binary-release

      - name: 'Github SHA'
        id: github-sha
        run: echo ${{ github.sha }} > Release.txt

      - name: Generate and promote AI changelog
        id: changelog
        uses: vscheuber/ai-changelog-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          changelog-path: CHANGELOG.md
          since: last-release
          target-user-type: user
          release-type: auto
          version: ${{ needs.build.outputs.newVersion }}
          promote-release: true
          release-tag: ${{ needs.build.outputs.newTag }}
          release-notes-path: RELEASE_NOTES.md
          commit: false

      - name: Commit updated changelog and version
        id: commit-changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json
          git commit --message "Updated changelog and version for release ${{ needs.build.outputs.newTag }}"
          git push

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Frodo CLI ${{ needs.build.outputs.newVersion }}
          tag_name: ${{ needs.build.outputs.newTag }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ needs.build.outputs.preRelease }}
          generate_release_notes: ${{ contains(needs.build.outputs.newTag, '-') }}
          files: |
            CHANGELOG.md
            LICENSE
            Release.txt
            frodo-linux-x64-${{ needs.build.outputs.newVersion }}.zip
            frodo-linux-arm64-${{ needs.build.outputs.newVersion }}.zip
            frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip
            frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip
            frodo-windows-x64-${{ needs.build.outputs.newVersion }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  npm-release:
    if: github.event_name != 'pull_request'
    # npm-release only needs the build job but since it is inconvenient to unpublish an npm we want this job to run last
    needs:
      [
        build,
        linux-x64-binary-release,
        linux-arm64-binary-release,
        macos-intel-binary-release,
        macos-arm64-binary-release,
        windows-x64-binary-release,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/download-artifact@v7
        with:
          name: build

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        id: npm-publish
        uses: vscheuber/npm-trusted-publish-action@v1
        with:
          release-type: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release-type || (fromJSON(needs.build.outputs.preRelease) && 'prerelease' || 'patch') }}
          package-name: '@rockcarver/frodo-cli'
          version: ${{ needs.build.outputs.newVersion }}
          dual-release-on-stable: 'true'

      - name: Publish summary
        run: |
          stable_version='${{ needs.build.outputs.newVersion }}'
          publish_tag='${{ steps.npm-publish.outputs.tag }}'
          is_prerelease='${{ steps.npm-publish.outputs.is-prerelease }}'
          stable_published='${{ steps.npm-publish.outputs.stable_published }}'
          stable_already='${{ steps.npm-publish.outputs.stable_already_published }}'
          companion_published='${{ steps.npm-publish.outputs.companion_prerelease_published }}'
          companion_already='${{ steps.npm-publish.outputs.companion_prerelease_already_published }}'
          companion_version='${{ steps.npm-publish.outputs.companion_prerelease_version }}'

          echo "is_prerelease=${is_prerelease}"
          echo "stable_version=${stable_version}"
          echo "publish_tag=${publish_tag}"

          if [[ "$is_prerelease" == 'true' ]]; then
            if [[ "$stable_published" == 'true' ]]; then
              echo "result=published prerelease to next"
            elif [[ '${{ steps.npm-publish.outputs.already_published }}' == 'true' ]]; then
              echo "result=prerelease already published, skipped"
            else
              echo "result=no publish performed"
            fi
          else
            echo "companion_prerelease_version=${companion_version}"
            if [[ "$companion_published" == 'true' ]]; then
              echo "companion_result=published ${companion_version} to next"
            elif [[ "$companion_already" == 'true' ]]; then
              echo "companion_result=already published (${companion_version})"
            else
              echo "companion_result=not attempted"
            fi

            if [[ "$stable_published" == 'true' ]]; then
              echo "stable_result=published ${stable_version} to ${publish_tag}"
            elif [[ "$stable_already" == 'true' ]]; then
              echo "stable_result=already published (${stable_version})"
            else
              echo "stable_result=not attempted"
            fi
          fi

  homebrew-formula-update:
    if: github.event_name != 'pull_request'
    name: Bump Homebrew formula
    needs: [release, build, npm-release]
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v3
        if: ${{ ! fromJSON(needs.build.outputs.preRelease) }}
        with:
          formula-name: frodo-cli
          formula-path: Formula/frodo-cli.rb
          homebrew-tap: rockcarver/homebrew-frodo-cli
          push-to: rockcarver/homebrew-frodo-cli
          tag-name: ${{ needs.build.outputs.newTag }}
          download-url: https://github.com/rockcarver/frodo-cli.git
        env:
          COMMITTER_TOKEN: ${{ secrets.PAT_HOMEBREW_FORMULA_REPO }}
      - uses: mislav/bump-homebrew-formula-action@v3
        # if: ${{ fromJSON(needs.build.outputs.preRelease) }}
        with:
          formula-name: frodo-cli-next
          formula-path: Formula/frodo-cli-next.rb
          homebrew-tap: rockcarver/homebrew-frodo-cli
          push-to: rockcarver/homebrew-frodo-cli
          tag-name: ${{ needs.build.outputs.newTag }}
          download-url: https://github.com/rockcarver/frodo-cli.git
        env:
          COMMITTER_TOKEN: ${{ secrets.PAT_HOMEBREW_FORMULA_REPO }}

  macos-intel-binary-release:
    # don't run on PRs, since secrets are not available
    if: github.event_name != 'pull_request'
    needs: [build, test]
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Install the Apple certificate
        env:
          DEVELOPMENT_CERTIFICATE_DATA: ${{ secrets.DEVELOPMENT_CERTIFICATE_DATA }}
          DEVELOPMENT_CERTIFICATE_PASSPHRASE: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSPHRASE }}
          INTERMEDIATE_CERTIFICATE_DATA: ${{ secrets.INTERMEDIATE_CERTIFICATE_DATA }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          INTERMEDIATE_CERTIFICATE_PATH=$RUNNER_TEMP/intermediate_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificates from secrets
          echo -n "$DEVELOPMENT_CERTIFICATE_DATA" | base64 -d -o $CERTIFICATE_PATH
          echo -n "$INTERMEDIATE_CERTIFICATE_DATA" | base64 -d -o $INTERMEDIATE_CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          #security import $INTERMEDIATE_CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - uses: actions/download-artifact@v4
        with:
          name: build

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run dist-pkg

      - name: Sign distribution binary
        run: |
          cat > entitlements.plist <<DELIM
          <dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          DELIM
          codesign -f -s 'Developer ID Application' --options runtime --entitlements entitlements.plist --timestamp --deep frodo

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./frodo -v
          ./frodo journey -h
          ./frodo journey export -h

      - name: Create zip file
        run: ditto -c -k frodo frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip

      - name: Notorize
        run: xcrun notarytool submit --apple-id ${{ secrets.AC_USERNAME }} --password ${{ secrets.AC_PASSWORD }} --team-id ${{ secrets.AC_TEAM_ID }} --wait frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip

      - uses: actions/upload-artifact@v6
        with:
          name: macos-intel-binary-release
          path: frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip

  macos-arm64-binary-release:
    # don't run on PRs, since secrets are not available
    if: github.event_name != 'pull_request'
    needs: [build, test]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Install the Apple certificate
        env:
          DEVELOPMENT_CERTIFICATE_DATA: ${{ secrets.DEVELOPMENT_CERTIFICATE_DATA }}
          DEVELOPMENT_CERTIFICATE_PASSPHRASE: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSPHRASE }}
          INTERMEDIATE_CERTIFICATE_DATA: ${{ secrets.INTERMEDIATE_CERTIFICATE_DATA }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          INTERMEDIATE_CERTIFICATE_PATH=$RUNNER_TEMP/intermediate_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificates from secrets
          echo -n "$DEVELOPMENT_CERTIFICATE_DATA" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$INTERMEDIATE_CERTIFICATE_DATA" | base64 --decode --output $INTERMEDIATE_CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          #security import $INTERMEDIATE_CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - uses: actions/download-artifact@v7
        with:
          name: build

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run dist-pkg

      - name: Sign distribution binary
        run: |
          cat > entitlements.plist <<DELIM
          <dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          DELIM
          codesign -f -s 'Developer ID Application' --options runtime --entitlements entitlements.plist --timestamp --deep frodo

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./frodo -v
          ./frodo journey -h
          ./frodo journey export -h

      - name: Create zip file
        run: ditto -c -k frodo frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip

      - name: Notorize
        run: xcrun notarytool submit --apple-id ${{ secrets.AC_USERNAME }} --password ${{ secrets.AC_PASSWORD }} --team-id ${{ secrets.AC_TEAM_ID }} --wait frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip

      - uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-binary-release
          path: frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip

  linux-x64-binary-release:
    # run on PRs for e2e testing binary builds as linux builds do not require secrets.
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run dist-pkg

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./frodo -v
          ./frodo journey -h
          ./frodo journey export -h

      - name: Archive distribution binary
        run: zip -Z bzip2 frodo-linux-x64-${{ needs.build.outputs.newVersion }}.zip frodo

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-binary-release
          path: frodo-linux-x64-${{ needs.build.outputs.newVersion }}.zip

  linux-arm64-binary-release:
    # don't run on PRs to speed up the checks
    if: github.event_name != 'pull_request'
    needs: [build, test]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run dist-pkg

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./frodo -v
          ./frodo journey -h
          ./frodo journey export -h

      - name: Archive distribution binary
        run: zip -Z bzip2 frodo-linux-arm64-${{ needs.build.outputs.newVersion }}.zip frodo

      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-binary-release
          path: frodo-linux-arm64-${{ needs.build.outputs.newVersion }}.zip

  windows-x64-binary-release:
    # don't run on PRs to speed up the checks
    if: github.event_name != 'pull_request'
    needs: [build, test]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run dist-pkg

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./frodo.exe -v
          ./frodo.exe journey -h
          ./frodo.exe journey export -h

      - name: Archive distribution binary
        run: 7z a -tzip frodo-windows-x64-${{ needs.build.outputs.newVersion }}.zip frodo.exe

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64-binary-release
          path: frodo-windows-x64-${{ needs.build.outputs.newVersion }}.zip
