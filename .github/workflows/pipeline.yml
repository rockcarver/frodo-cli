name: 'Frodo CLI Release Pipeline'

on:
  pull_request:
    branches:
      - 'main'
    # No paths-ignore here: with required status checks on main, a PR whose
    # changes skip CI entirely could never merge (its required checks would
    # stay "expected" forever). Docs-only PRs run the full pipeline. The push
    # trigger keeps paths-ignore so docs-only pushes to main stay cheap.
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/CODE_OF_CONDUCT.md'
      - '**/README.md'
      - '**/pipeline.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release kind: prerelease | premajor | patch | minor | major'
        type: choice
        options:
          - prerelease
          - premajor
          - patch
          - minor
          - major
        default: 'prerelease'
        required: true

# Cancel superseded runs: each new push to a PR (including Dependabot
# rebases) cancels the previous run for the same ref instead of piling up
# full test cycles. Release dispatches get their own group so a release is
# never cancelled by a push.
concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  # Native SEA builds embed the runtime binary, which must be Node >= 25.5
  # (--build-sea). Binary jobs install this version explicitly.
  SEA_NODE_VERSION: 26
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rockcarver'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Update package-lock.json before version bump
        run: npm i --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Read current manifest version
        id: current-manifest
        run: |
          echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Resolve release type
        id: release-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=${{ github.event.inputs.release-type }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Compute Version Bump'
        id: version-bump
        uses: vscheuber/version-bump-action@v1
        with:
          release-type: ${{ steps.release-type.outputs.value }}

      - name: Release preflight checks
        if: github.event_name != 'pull_request'
        uses: vscheuber/release-preflight-action@v1
        with:
          candidate-version: ${{ steps.version-bump.outputs.newVersion }}
          candidate-tag: ${{ steps.version-bump.outputs.newTag }}
          package-name: '@rockcarver/frodo-cli'
          current-version: ${{ steps.current-manifest.outputs.value }}
          check-remote-tag: true
          check-npm-version: true
          check-version-drift: true

      - name: Update package.json and package-lock.json
        uses: vscheuber/manifest-version-update-action@v1
        with:
          version: ${{ steps.version-bump.outputs.newVersion }}

      - name: Update package-lock.json after version bump
        run: npm i --package-lock-only

      - name: Validate MCP SDK track
        run: npm run check:mcp-sdk-track

      - name: Build frodo-cli
        # build:only = the npm bundle (dist/) + typecheck. NOT `npm run
        # build`: that now means the full build including the SEA binary,
        # which needs Node 26 - and this job (and the artifact it uploads)
        # intentionally runs on Node 24; the binary jobs bundle the SEA from
        # source themselves.
        run: |
          npm run build:only

      - name: Lint
        run: npm run check

      - name: Type Check
        run: npx tsc

      - name: Security Audit
        run: npm audit fix --audit-level critical

      - uses: actions/upload-artifact@v7
        with:
          name: build
          # Binary jobs run `npm run build:binary` themselves (SEA bundles
          # from source), so they need the sources and build configs too.
          path: |
            package.json
            package-lock.json
            src
            scripts
            tsconfig.json
            tsdown.config.ts
            tsdown.sea.config.mts
            sea-config.json
            dist

    outputs:
      newTag: ${{ steps.version-bump.outputs.newTag }}
      newVersion: ${{ steps.version-bump.outputs.newVersion }}
      preRelease: ${{ steps.version-bump.outputs.preRelease }}
      releaseType: ${{ steps.release-type.outputs.value }}
      actionReleaseType: ${{ steps.version-bump.outputs.action_release_type }}

  test:
    name: 'Test'
    needs: build
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The CLI's supported runtime is the SEA binary, which is built on
        # Node 26 - so 26 is the only version the tests need. (frodo-lib,
        # which the CLI embeds, keeps its own wider matrix in its repo.)
        node-version: [26]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          fetch-tags: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Use Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify Python runtime for PTY shell tests
        run: python3 --version

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Install dependencies
        run: npm ci

      # The e2e suites shell out to `frodo` and the test helpers pin that to
      # this checkout's SEA binary (dist-sea/, built on demand). Building the
      # binary here - not `npm i -g` - means the tests exercise exactly the
      # artifact the release jobs ship. `--build-sea` needs Node >= 25.5,
      # which the matrix now guarantees (26).
      - name: Build SEA binary
        run: npm run build:binary

      - name: CLI Tests
        env:
          FRODO_MASTER_KEY: ${{ secrets.FRODO_MASTER_KEY }}
        # Sea mode: jest's default parallel scheduling (one worker per suite)
        # against the SEA binary - exactly the artifact the release jobs
        # ship. The e2e suites are replay-only (FRODO_MOCK=1) with per-suite
        # connections profiles and per-suite export directories, so suites
        # are isolated; --runInBand was retired after the file-lifecycle
        # races it guarded against were fixed (per-suite export dir names,
        # mkdtemp PTY homes). Developers default to dev mode (`npm test`,
        # node dist/launch.cjs - no SEA build needed); FRODO_TEST_BINARY=sea
        # selects the binary here.
        run: npm run test:binary

      - name: Version Test
        run: ./dist-sea/frodo -v

  # Single stable-named gate over the versioned test matrix. Required status
  # checks on main point at THIS job, so changing the matrix's Node versions
  # never touches repo settings. It fails if any matrix leg fails or is
  # cancelled/skipped unexpectedly.
  test-gate:
    name: 'Test gate'
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test matrix leg did not succeed
        run: |
          result='${{ needs.test.result }}'
          echo "test matrix result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::Not all test matrix legs succeeded"
            exit 1
          fi

  test-live:
    name: 'Live Tenant Smoke Test'
    needs: build
    # don't run on PRs -> secrets are not available as workflow runs in the context of the external repo
    if: github.event_name != 'pull_request'
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest

    # Service containers to run with `test-live`
    services:
      # Label used to access the service container
      squid:
        image: ubuntu/squid
        ports:
          # Maps tcp port 3128 on the host to the same port in the service container
          - 3128:3128

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Install dependencies
        run: npm ci

      - name: Install frodo-cli globally
        run: npm i -g

      - name: Direct Tests
        env:
          FIDC_TENANT_URL: ${{ vars.FIDC_TENANT_URL }}
          FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          frodo conn save "$FIDC_TENANT_URL" --no-log-api
          frodo info "$FIDC_TENANT_URL"

      - name: Proxy Tests
        env:
          HTTPS_PROXY: 'http://127.0.0.1:3128'
          FIDC_TENANT_URL: ${{ vars.FIDC_TENANT_URL }}
          FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          frodo conn save "$FIDC_TENANT_URL" --no-log-api
          frodo info "$FIDC_TENANT_URL"

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      [
        build,
        test-live,
        linux-x64-binary-release,
        linux-arm64-binary-release,
        macos-intel-binary-release,
        macos-arm64-binary-release,
        npm-release,
        windows-x64-binary-release,
      ]
    name: 'Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          # Push the release commit with the org-wide FRODO_CI_PAT instead of
          # GITHUB_TOKEN: the main-branch ruleset's required status checks
          # reject github-actions[bot] pushes (the Actions app cannot be a
          # bypass actor), while PAT-attributed pushes from a repository
          # admin are covered by the ruleset's bypass. See docs/PIPELINE.md.
          token: ${{ secrets.FRODO_CI_PAT }}

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Download MacOS Intel Binary Release
        uses: actions/download-artifact@v8
        with:
          name: macos-intel-binary-release

      - name: Download MacOS ARM64 Binary Release
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-binary-release

      - name: Download Linux X64 Binary Release
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-binary-release

      - name: Download Linux ARM64 Binary Release
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-binary-release

      - name: Download Windows X64 Binary Release
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-binary-release

      - name: 'Github SHA'
        id: github-sha
        run: echo ${{ github.sha }} > Release.txt

      - name: Generate and promote AI changelog
        id: changelog
        uses: vscheuber/ai-changelog-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          changelog-path: CHANGELOG.md
          since: last-release
          target-user-type: user
          release-type: auto
          version: ${{ needs.build.outputs.newVersion }}
          promote-release: true
          release-tag: ${{ needs.build.outputs.newTag }}
          release-notes-path: RELEASE_NOTES.md
          commit: false

      - name: Commit updated changelog and version
        id: commit-changelog
        env:
          FRODO_CI_PAT: ${{ secrets.FRODO_CI_PAT }}
        run: |
          set -euo pipefail
          # Refuse to run on an unauthenticated PAT (e.g. fork runs) instead
          # of silently pushing with GITHUB_TOKEN and tripping the ruleset.
          if [ -z "${FRODO_CI_PAT}" ]; then
            echo "::error::FRODO_CI_PAT secret is not set; cannot push the release commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json
          git commit --message "Updated changelog and version for release ${{ needs.build.outputs.newTag }}"
          git push

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Frodo CLI ${{ needs.build.outputs.newVersion }}
          tag_name: ${{ needs.build.outputs.newTag }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ needs.build.outputs.preRelease }}
          generate_release_notes: ${{ contains(needs.build.outputs.newTag, '-') }}
          files: |
            CHANGELOG.md
            LICENSE
            Release.txt
            frodo-linux-x64-${{ needs.build.outputs.newVersion }}.zip
            frodo-linux-arm64-${{ needs.build.outputs.newVersion }}.zip
            frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip
            frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip
            frodo-windows-x64-${{ needs.build.outputs.newVersion }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  npm-release:
    if: github.event_name == 'workflow_dispatch'
    # npm-release only needs the build job but since it is inconvenient to unpublish an npm we want this job to run last
    needs:
      [
        build,
        test-live,
        linux-x64-binary-release,
        linux-arm64-binary-release,
        macos-intel-binary-release,
        macos-arm64-binary-release,
        windows-x64-binary-release,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        id: npm-publish
        uses: vscheuber/npm-trusted-publish-action@v1
        with:
          release-type: ${{ needs.build.outputs.releaseType || 'prerelease' }}
          package-name: '@rockcarver/frodo-cli'
          version: ${{ needs.build.outputs.newVersion }}
          dual-release-on-stable: 'true'

      - name: Publish summary
        run: |
          stable_version='${{ needs.build.outputs.newVersion }}'
          publish_tag='${{ steps.npm-publish.outputs.tag }}'
          is_prerelease='${{ steps.npm-publish.outputs.is-prerelease }}'
          stable_published='${{ steps.npm-publish.outputs.stable_published }}'
          stable_already='${{ steps.npm-publish.outputs.stable_already_published }}'
          companion_published='${{ steps.npm-publish.outputs.companion_prerelease_published }}'
          companion_already='${{ steps.npm-publish.outputs.companion_prerelease_already_published }}'
          companion_version='${{ steps.npm-publish.outputs.companion_prerelease_version }}'

          echo "is_prerelease=${is_prerelease}"
          echo "stable_version=${stable_version}"
          echo "publish_tag=${publish_tag}"

          if [[ "$is_prerelease" == 'true' ]]; then
            if [[ "$stable_published" == 'true' ]]; then
              echo "result=published prerelease to next"
            elif [[ '${{ steps.npm-publish.outputs.already_published }}' == 'true' ]]; then
              echo "result=prerelease already published, skipped"
            else
              echo "result=no publish performed"
            fi
          else
            echo "companion_prerelease_version=${companion_version}"
            if [[ "$companion_published" == 'true' ]]; then
              echo "companion_result=published ${companion_version} to next"
            elif [[ "$companion_already" == 'true' ]]; then
              echo "companion_result=already published (${companion_version})"
            else
              echo "companion_result=not attempted"
            fi

            if [[ "$stable_published" == 'true' ]]; then
              echo "stable_result=published ${stable_version} to ${publish_tag}"
            elif [[ "$stable_already" == 'true' ]]; then
              echo "stable_result=already published (${stable_version})"
            else
              echo "stable_result=not attempted"
            fi
          fi

  homebrew-formula-update:
    if: github.event_name == 'workflow_dispatch'
    name: Update Homebrew formulas (prebuilt zips)
    needs: [release, build, npm-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Generates both formulas from the per-arch release zips the pipeline
      # built, tested, signed and notarized. Homebrew then installs the exact
      # tested artifact instead of building a second, untested binary from
      # source on the user's machine (which also required node@24).
      - name: Generate formulas
        env:
          GH_TOKEN: ${{ secrets.FRODO_CI_PAT }}
        run: |
          node tools/update-homebrew-formula.mjs \
            ${{ needs.build.outputs.newVersion }} \
            ${{ needs.build.outputs.newTag }} \
            "$RUNNER_TEMP/frodo-formulas"
      - name: Push formula updates to the tap
        env:
          GH_TOKEN: ${{ secrets.FRODO_CI_PAT }}
          NEEDS_VERSION: ${{ needs.build.outputs.newVersion }}
        run: |
          gh repo clone rockcarver/homebrew-frodo-cli tap
          cd tap
          git config user.name "rockcarver-pipeline"
          git config user.email "actions@github.com"
          # The generator only writes frodo-cli.rb for stable releases; a
          # prerelease (e.g. 5.0.0-1) must not touch the stable formula, so
          # copy whichever formulas it produced.
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/frodo-formulas/*.rb; do
            cp "$f" "Formula/$(basename "$f")"
            git add "Formula/$(basename "$f")"
          done
          if git diff --cached --quiet; then
            echo "Formulas already up to date for ${{ needs.build.outputs.newTag }}"
          else
            git commit -m "frodo-cli ${NEEDS_VERSION} (prebuilt binary zips)"
            git push origin main
          fi

  macos-intel-binary-release:
    # Cross-builds the x64 binary on the arm64 runner via the SEA
    # `executable` field (the macos-15-intel runner retires Aug 2027, and
    # nodejs/node#65479 makes --build-sea unusable on x64 *hosts* - the
    # arm64-host/x64-target path is unaffected). Smoke-tested under
    # Rosetta below.
    # don't run on PRs, since secrets are not available
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Install the Apple certificate
        env:
          DEVELOPMENT_CERTIFICATE_DATA: ${{ secrets.DEVELOPMENT_CERTIFICATE_DATA }}
          DEVELOPMENT_CERTIFICATE_PASSPHRASE: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSPHRASE }}
          INTERMEDIATE_CERTIFICATE_DATA: ${{ secrets.INTERMEDIATE_CERTIFICATE_DATA }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          INTERMEDIATE_CERTIFICATE_PATH=$RUNNER_TEMP/intermediate_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificates from secrets
          echo -n "$DEVELOPMENT_CERTIFICATE_DATA" | base64 -d -o $CERTIFICATE_PATH
          echo -n "$INTERMEDIATE_CERTIFICATE_DATA" | base64 -d -o $INTERMEDIATE_CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          #security import $INTERMEDIATE_CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/setup-node@v7
        with:
          # node --build-sea needs >= 25.5; 26 is current. The build itself
          # runs on arm64; the x64 runtime binary is fetched separately.
          node-version: ${{ env.SEA_NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA bundle
        run: npm run build:sea-bundle

      # Cross-build: point the SEA config's `executable` at the official
      # darwin-x64 Node binary (same Node version as the blob producer).
      # useCodeCache must be off for cross-architecture builds: the cache
      # is generated by the HOST architecture's Node and is useless (and
      # possibly fatal) on the x64 target.
      - name: Download darwin-x64 Node runtime
        run: |
          NODE_SEA_VERSION=$(node -p process.versions.node)
          curl -sSfL -o /tmp/node-darwin-x64.tar.gz \
            "https://nodejs.org/dist/v${NODE_SEA_VERSION}/node-v${NODE_SEA_VERSION}-darwin-x64.tar.gz"
          mkdir -p build-sea-runtime
          tar xf /tmp/node-darwin-x64.tar.gz -C build-sea-runtime --strip-components=2 \
            "node-v${NODE_SEA_VERSION}-darwin-x64/bin/node"

      - name: Build SEA binary (darwin-x64 target)
        run: |
          node -e "
            const cfg = require('./sea-config.json');
            cfg.executable = 'build-sea-runtime/node';
            cfg.output = 'dist-sea/frodo';
            cfg.useCodeCache = false;
            require('fs').writeFileSync('sea-config.build.json', JSON.stringify(cfg, null, 2));
          "
          node --build-sea sea-config.build.json

      # --build-sea output is UNSIGNED (the injector strips the base Node
      # signature and does not re-sign). Sign with Developer ID before the
      # Rosetta smoke test; sign strictly LAST: any byte change after this
      # invalidates the signature.
      - name: Sign distribution binary
        run: |
          cat > entitlements.plist <<DELIM
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
          </dict>
          DELIM
          codesign --force --sign 'Developer ID Application' --options runtime --entitlements entitlements.plist --timestamp dist-sea/frodo
          codesign --verify --strict --verbose=2 dist-sea/frodo

      #
      # Fail early on failing tests. The x64 binary runs under Rosetta 2
      # on this arm64 runner (preinstalled on GitHub macOS images).
      #
      - name: 'Test (under Rosetta)'
        run: |
          ./dist-sea/frodo -v
          ./dist-sea/frodo journey -h
          ./dist-sea/frodo journey export -h

      - name: Create zip file
        run: ditto -c -k dist-sea/frodo frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip

      - name: Notorize
        run: xcrun notarytool submit --apple-id ${{ secrets.AC_USERNAME }} --password ${{ secrets.AC_PASSWORD }} --team-id ${{ secrets.AC_TEAM_ID }} --wait frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macos-intel-binary-release
          path: frodo-macos-intel-${{ needs.build.outputs.newVersion }}.zip

  macos-arm64-binary-release:
    # don't run on PRs, since secrets are not available
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Install the Apple certificate
        env:
          DEVELOPMENT_CERTIFICATE_DATA: ${{ secrets.DEVELOPMENT_CERTIFICATE_DATA }}
          DEVELOPMENT_CERTIFICATE_PASSPHRASE: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSPHRASE }}
          INTERMEDIATE_CERTIFICATE_DATA: ${{ secrets.INTERMEDIATE_CERTIFICATE_DATA }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          INTERMEDIATE_CERTIFICATE_PATH=$RUNNER_TEMP/intermediate_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificates from secrets
          echo -n "$DEVELOPMENT_CERTIFICATE_DATA" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$INTERMEDIATE_CERTIFICATE_DATA" | base64 --decode --output $INTERMEDIATE_CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          #security import $INTERMEDIATE_CERTIFICATE_PATH -P "$DEVELOPMENT_CERTIFICATE_PASSPHRASE" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/setup-node@v7
        with:
          # node --build-sea needs >= 25.5; 26 is current.
          node-version: ${{ env.SEA_NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA binary
        run: npm run build:binary

      # --build-sea output is UNSIGNED (the injector strips the base Node
      # signature and does not re-sign). Unsigned arm64 binaries are killed
      # by the kernel (SIGKILL), so sign immediately. Sign strictly LAST:
      # any byte change after this invalidates the signature.
      - name: Sign distribution binary
        run: |
          cat > entitlements.plist <<DELIM
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
          </dict>
          DELIM
          codesign --force --sign 'Developer ID Application' --options runtime --entitlements entitlements.plist --timestamp dist-sea/frodo
          codesign --verify --strict --verbose=2 dist-sea/frodo

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./dist-sea/frodo -v
          ./dist-sea/frodo journey -h
          ./dist-sea/frodo journey export -h

      - name: Create zip file
        run: ditto -c -k dist-sea/frodo frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip

      - name: Notorize
        run: xcrun notarytool submit --apple-id ${{ secrets.AC_USERNAME }} --password ${{ secrets.AC_PASSWORD }} --team-id ${{ secrets.AC_TEAM_ID }} --wait frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-binary-release
          path: frodo-macos-arm64-${{ needs.build.outputs.newVersion }}.zip

  linux-x64-binary-release:
    # run on PRs for e2e testing binary builds as linux builds do not require secrets.
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/setup-node@v7
        with:
          # node --build-sea needs >= 25.5; 26 is current.
          node-version: ${{ env.SEA_NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA binary
        run: npm run build:binary

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./dist-sea/frodo -v
          ./dist-sea/frodo journey -h
          ./dist-sea/frodo journey export -h

      - name: Archive distribution binary
        run: zip -Z bzip2 frodo-linux-x64-${{ needs.build.outputs.newVersion }}.zip dist-sea/frodo

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-binary-release
          path: frodo-linux-x64-${{ needs.build.outputs.newVersion }}.zip

  linux-arm64-binary-release:
    # Native arm64 runner (not a container) - SEA binaries need a full
    # glibc userland; alpine is not a supported SEA platform.
    # don't run on PRs to speed up the checks
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/setup-node@v7
        with:
          # node --build-sea needs >= 25.5; 26 is current.
          node-version: ${{ env.SEA_NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA binary
        run: npm run build:binary

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./dist-sea/frodo -v
          ./dist-sea/frodo journey -h
          ./dist-sea/frodo journey export -h

      - name: Archive distribution binary
        run: zip -Z bzip2 frodo-linux-arm64-${{ needs.build.outputs.newVersion }}.zip dist-sea/frodo

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-binary-release
          path: frodo-linux-arm64-${{ needs.build.outputs.newVersion }}.zip

  windows-x64-binary-release:
    # don't run on PRs to speed up the checks
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/setup-node@v7
        with:
          # node --build-sea needs >= 25.5; 26 is current.
          node-version: ${{ env.SEA_NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA binary
        shell: pwsh
        run: |
          # build:binary = bundle (tsdown.sea.config.mts -> dist-sea/app.cjs,
          # the file sea-config.json's main points at) + node --build-sea.
          # build:only alone produces dist/ only, so --build-sea fails with
          # "Cannot read main script dist-sea/app.cjs".
          npm run build:binary
          # sea-config.json writes dist-sea/frodo; the Windows artifact is
          # dist-sea/frodo.exe
          # (Version.ts binary detection keys on the executable's basename).
          Copy-Item dist-sea/frodo dist-sea/frodo.exe

      #
      # Fail early on failing tests.
      #
      - name: 'Test'
        run: |
          ./dist-sea/frodo.exe -v
          ./dist-sea/frodo.exe journey -h
          ./dist-sea/frodo.exe journey export -h

      - name: Archive distribution binary
        run: 7z a -tzip frodo-windows-x64-${{ needs.build.outputs.newVersion }}.zip dist-sea/frodo.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-binary-release
          path: frodo-windows-x64-${{ needs.build.outputs.newVersion }}.zip
